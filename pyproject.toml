[project]
name = "bitt"
version = "0.1.0"
description = "A research-workflow kernel: an append-only, content-addressed record + cards that define every allowed write."
requires-python = ">=3.12"   # f-strings with backslashes (PEP 701): tests/test_lint.py checks the floor
dependencies = ["pyyaml>=6", "psycopg[binary]>=3.1"]   # the store is Postgres (docs/v2/db.md §2)

[project.optional-dependencies]
xlsx = [
    "openpyxl>=3.1.5",
]

[project.scripts]
bitt = "bitt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "psycopg[binary]>=3.1",
    "openpyxl>=3.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bitt"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "bitt/SKILL.md"            # a release carries its skills (src/bitt/skills.py)
"spec/cards" = "bitt/cards"            # and its cards (src/bitt/cards.py CARDS)

[tool.pytest.ini_options]
testpaths = ["tests"]
